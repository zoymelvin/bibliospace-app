name: Build & Deploy

on:
  push:
    branches: ["main"]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true


      - name: Create Dummy Keystore for CI
        run: |
          echo "storeFile=release-keystore.jks" > android/key.properties
          echo "storePassword=password123" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "keyPassword=password123" >> android/key.properties
          
          keytool -genkey -v -keystore android/app/release-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -dname "CN=Android Debug,O=Android,C=US" -storepass password123 -keypass password123

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          testers: "zoymelvin04@gmail.com, fredyka.maulana@gmail.com"
          file: build/app/outputs/flutter-apk/app-release.apk